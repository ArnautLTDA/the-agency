[project]
name = "agency-engine"
version = "0.1.0"
description = "The Agency Engine - Standalone Autonomous Agent Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.0",
    "litellm>=1.52.0",
    "loguru>=0.7.3",
    "mcp>=2.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
