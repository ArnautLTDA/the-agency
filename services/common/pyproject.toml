[project]
name = "agency-common"
version = "0.1.0"
description = "Shared AMQP, Security and Contracts for The Agency Microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --cov=src --cov-report=term-missing"
